# pyproject.toml

[project]
name = "codegraph-engineering-copilot"
version = "0.1.0"
description = "AI Engineering Chatbot MVP"
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.1.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "neo4j>=6.3.1",
    "openai>=3.3.1",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "ragas>=0.3.1",
    "uvicorn<0.36.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.0.0",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.mypy]
strict = true
disallow_untyped_decorators = false
warn_return_any = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "httpx.*",
    "openai.*"
]
ignore_missing_imports = true
