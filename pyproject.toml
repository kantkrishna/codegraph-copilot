# pyproject.toml

# This file configures the UV project dependencies, Pytest coverage rules, 
# and strict type-checking settings for Mypy.

[project]
name = "codegraph-copilot"
version = "0.1.0"
description = "Codegraph AI Engineering Chatbot"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = true
show_error_codes = true